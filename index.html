<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff4df" />
  <title>はみがきくん</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" aria-label="幼児向け歯みがきゲーム">
    <section class="game-card" id="gameCard">
      <div class="top-row">
        <div class="title-wrap">
          <div class="mini-apple" aria-hidden="true">🍎</div>
          <h1>はみがきタイム！</h1>
        </div>
        <div class="timer" id="timer" aria-live="polite">90</div>
      </div>

      <div class="stage" id="stage">
        <div class="glow-layer" aria-hidden="true"></div>
        <div class="mouth" aria-hidden="true">
          <div class="gum gum-top"></div>
          <div class="teeth upper-teeth" id="upperTeeth"></div>
          <div class="mouth-space"></div>
          <div class="teeth lower-teeth" id="lowerTeeth"></div>
          <div class="gum gum-bottom"></div>
        </div>

        <div class="germ germ-1" data-germ="1" aria-hidden="true">
          <span class="germ-eye"></span><span class="germ-eye"></span><span class="germ-mouth"></span>
        </div>
        <div class="germ germ-2" data-germ="2" aria-hidden="true">
          <span class="germ-eye"></span><span class="germ-eye"></span><span class="germ-mouth"></span>
        </div>
        <div class="germ germ-3" data-germ="3" aria-hidden="true">
          <span class="germ-eye"></span><span class="germ-eye"></span><span class="germ-mouth"></span>
        </div>

        <div class="bubble-layer" id="bubbleLayer" aria-hidden="true"></div>
        <div class="sparkle-layer" id="sparkleLayer" aria-hidden="true"></div>

        <div class="brush" id="brush" aria-hidden="true">
          <div class="brush-handle"></div>
          <div class="brush-neck"></div>
          <div class="brush-head"><span></span><span></span><span></span></div>
        </div>

        <div class="message" id="message" aria-live="polite">リンゴをおしてね</div>
        <button class="apple-button" id="startButton" type="button" aria-label="スタート">
          <span class="apple-shine"></span>
          <span class="apple-leaf"></span>
        </button>
      </div>

      <div class="progress-shell" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
